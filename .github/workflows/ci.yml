name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    # The package supports macOS 14; macos-15 exercises AppKit focus and menu
    # behavior one release back and is required, like macos-26.
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select the newest Xcode 26 toolchain
        if: matrix.runner == 'macos-15'
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          [ -n "$xcode" ] || { echo "No Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$xcode"

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_ENV"

      - name: Cache the Swift build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The native engine builds under <triple>/; Xcode 27's Swift Build
          # engine under out/. The key names the toolchain so a new Xcode
          # never restores objects from the old one.
          path: |
            .build/arm64-apple-macosx
            .build/x86_64-apple-macosx
            .build/out
            .build/release-arm64
            .build/release-x86_64
          key: swift-build-${{ matrix.runner }}-${{ env.XCODE_BUILD }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: swift-build-${{ matrix.runner }}-${{ env.XCODE_BUILD }}-

      - name: Refuse stray files in the sources
        run: |
          stray="$(find Sources Tests -name '.*' -type f -not -name .DS_Store)"
          [ -z "$stray" ] || { echo "Stray files:"; echo "$stray"; exit 1; }

      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || brew install --quiet shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Upload state gallery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ring-stats-state-gallery-${{ matrix.runner }}-${{ github.sha }}
          overwrite: true
          path: .build/state-gallery
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble universal application bundle
        run: BUILD_ARCHS="arm64 x86_64" scripts/build_app.sh

      - name: Validate delivery scripts and artifact tamper checks
        run: scripts/tests/test_delivery_safety.sh

      - name: Verify the App Sandbox allows Keychain, loopback, and migration
        run: |
          scripts/tests/test_sandbox_keychain.sh
          scripts/tests/test_container_migration.sh

      - name: Verify application bundle
        run: scripts/verify_release_artifacts.sh

      - name: Create ad-hoc disk image
        run: SKIP_BUILD=1 scripts/create_dmg.sh

      - name: Mount and verify disk image
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/Info.plist)"
          DMG_PATH="$PWD/dist/Ring-Stats-$version.dmg" scripts/verify_release_artifacts.sh

      - name: Record artifact checksums
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/Info.plist)"
          shasum -a 256 "dist/Ring-Stats-$version.dmg" > "dist/Ring-Stats-$version.dmg.sha256"
          ditto -c -k --sequesterRsrc --keepParent "dist/Ring Stats.app" "dist/Ring-Stats-$version-app.zip"
          shasum -a 256 "dist/Ring-Stats-$version-app.zip" > "dist/Ring-Stats-$version-app.zip.sha256"

      - name: Generate SBOM
        run: scripts/generate_sbom.sh "dist/Ring Stats.app" dist/ring-stats.cdx.json

      - name: Upload verified CI artifacts
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ring-stats-unsigned-${{ github.sha }}
          overwrite: true
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*-app.zip
            dist/*-app.zip.sha256
            dist/*.cdx.json
            dist/candidate-manifest.json
            dist/candidate-manifest.sha256
            dist/candidates/*/Ring-Stats.dSYM.zip
            dist/candidates/*/uuids.txt
          if-no-files-found: error
          retention-days: 14

  # Attest what CI itself built, in a job that runs no repository scripts, so
  # the OIDC token never reaches code from a pull request. Public releases are
  # built and notarized on the maintainer's Mac and carry a separately signed
  # attestation.
  attest:
    name: Attest CI build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 10

    steps:
      - name: Download verified CI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ring-stats-unsigned-${{ github.sha }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*-app.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*-app.zip
          sbom-path: dist/ring-stats.cdx.json
